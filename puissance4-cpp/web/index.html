<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puissance 4 — Itération 6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Puissance 4</h1>
    <p class="sous-titre">Projet fil rouge — itération 6 : BDD et keyword testing</p>
  </header>

  <main>
    <form id="formulaire-partie" data-testid="formulaire-partie">
      <label><span>Joueur 1 <span class="pastille rouge"></span></span>
        <input id="joueur1" name="joueur1" data-testid="joueur1" maxlength="20" required>
      </label>
      <label><span>Joueur 2 <span class="pastille jaune"></span></span>
        <input id="joueur2" name="joueur2" data-testid="joueur2" maxlength="20" required>
      </label>
      <button type="submit" data-testid="nouvelle-partie">Nouvelle partie</button>
    </form>

    <p id="message" data-testid="message" role="status"></p>

    <section id="partie" hidden>
      <p class="infos">
        Partie <strong id="id-partie" data-testid="id-partie"></strong> —
        <span id="tour" data-testid="tour">au tour de <strong id="joueur-courant" data-testid="joueur-courant"></strong>
        <span id="pastille-courant" class="pastille"></span></span>
        <strong id="fin-partie" data-testid="fin-partie" hidden></strong>
        — <span id="nombre-coups" data-testid="nombre-coups">0</span> coup(s)
      </p>
      <div id="colonnes" class="colonnes" data-testid="colonnes"></div>
      <div id="grille" class="grille" data-testid="grille"></div>
    </section>
  </main>

  <footer>Serveur C++ · API REST · architecture hexagonale
    <span id="version" data-testid="version"></span></footer>
  <script src="app.js"></script>
</body>
</html>
